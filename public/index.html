<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#10b981">
  <title>ClickBank Alerts</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    .card { background-color: #1e293b; border-radius: 12px; padding: 20px; width: 100%; max-width: 450px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); }
    h1 { font-size: 1.25rem; font-weight: 700; color: #10b981; margin-bottom: 8px; }
    p { font-size: 0.875rem; color: #94a3b8; margin-bottom: 20px; }
    button { width: 100%; padding: 12px; background: #10b981; color: #042f2e; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    button:active { transform: scale(0.98); }
    #status { margin-top: 15px; font-size: 0.8rem; text-align: center; color: #38bdf8; word-break: break-word; }
    .logs-header { margin-top: 30px; font-size: 1rem; color: #e2e8f0; width: 100%; max-width: 450px; font-weight: 600; }
    #log-list { margin-top: 10px; width: 100%; max-width: 450px; display: flex; flex-direction: column; gap: 10px; }
    .log-item { background: #1e293b; border-left: 4px solid #10b981; padding: 12px; border-radius: 6px; font-size: 0.85rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>ClickBank Push Notifier</h1>
    <p>Ative as notificações para transformar esta página em um aplicativo de alertas em tempo real.</p>
    <button id="btn-subscribe">Ativar Alertas no Celular</button>
    <div id="status">Aguardando ativação...</div>
  </div>
  <div class="logs-header">Últimas Transações Recebidas</div>
  <div id="log-list"></div>
  <audio id="audio-alert" preload="auto">
    <source src="https://actions.google.com/sounds/v1/household/cash_register.ogg" type="audio/ogg">
  </audio>
  <script>
    const btnSubscribe = document.getElementById('btn-subscribe');
    const statusDiv = document.getElementById('status');
    const logList = document.getElementById('log-list');
    const alertAudio = document.getElementById('audio-alert');

    function urlB64ToUint8Array(base64String) {
      const padding = '='.repeat((4 - base64String.length % 4) % 4);
      const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
      const rawData = window.atob(base64);
      const outputArray = new Uint8Array(rawData.length);
      for (let i = 0; i < rawData.length; ++i) {
        outputArray[i] = rawData.charCodeAt(i);
      }
      return outputArray;
    }

    async function registerPWA() {
      if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
        statusDiv.innerText = "Seu navegador não suporta Web Push.";
        return;
      }
      try {
        const registration = await navigator.serviceWorker.register('/sw.js');
        statusDiv.innerText = "PWA instalado. Toque no botão para vincular alertas.";
        btnSubscribe.addEventListener('click', async () => {
          alertAudio.play().then(() => alertAudio.pause()).catch(() => {});
          const keyRes = await fetch('/vapid-public-key');
          const { publicKey } = await keyRes.json();
          const subscription = await registration.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: urlB64ToUint8Array(publicKey)
          });
          await fetch('/subscribe', {
            method: 'POST',
            body: JSON.stringify(subscription),
            headers: { 'Content-Type': 'application/json' }
          });
          statusDiv.innerText = "Dispositivo registrado com sucesso!";
          btnSubscribe.style.display = 'none';
        });
      } catch (err) {
        statusDiv.innerText = "Erro ao registrar: " + err.message;
      }
    }

    async function loadLogs() {
      try {
        const res = await fetch('/api/transactions');
        const data = await res.json();
        logList.innerHTML = data.map(item => `
          <div class="log-item">
            <strong>${item.type} - $${item.amount}</strong><br>
            Produto: ${item.itemTitle || 'Item'}<br>
            <small style="color: #64748b">${new Date(item.date).toLocaleTimeString()}</small>
          </div>
        `).join('');
      } catch (e) {}
    }

    setInterval(loadLogs, 10000);
    loadLogs();
    registerPWA();
  </script>
</body>
</html>
